name: VaultMind Ball Fight Pipeline
"on":
  schedule:
    - cron: '0 17 * * *'    # once daily, 17:00 UTC — adjust to your best TikTok posting slot
  workflow_dispatch: {}      # manual "Run workflow" button, no inputs needed
jobs:
  generate-ballfight-video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core fonts-liberation fonts-open-sans
          echo "ffmpeg: $(ffmpeg -version | head -1)"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate + post ball-fight video
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY:            ${{ secrets.ELEVENLABS_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          # Preferred TikTok route (public posts): Zernio
          ZERNIO_API_KEY:            ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID:  ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          # Fallback when no Zernio key is set: direct TikTok API (private posts until audited)
          TIKTOK_CLIENT_KEY:         ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:      ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN:      ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python pipeline.py
